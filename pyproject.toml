[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypewire"
version = "0.1.0"
description = "Python wrapper for PipeWire"
requires-python = ">=3.8"
authors = [{name = "Daniel Erwan", email = "contact@erwandaniel.fr"}]
dependencies = [
    "setuptools>=75.3.3",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { file = "**.c" }]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "testcontainers>=3.7.1",
]
