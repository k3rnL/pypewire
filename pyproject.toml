[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypewire"
version = "0.1.0"
description = "Python wrapper for PipeWire"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Daniel Erwan", email = "contact@erwandaniel.fr"}]
license = "MIT"
license-files = [
    "LICENSE"
]
keywords = ["pipewire", "audio", "video", "multimedia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "setuptools>=75.3.3",
]

[project.urls]
Homepage = "https://github.com/k3rnL/pypewire"
Repository = "https://github.com/k3rnL/pypewire"
Issues = "https://github.com/k3rnL/pypewire/issues"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { file = "**.c" }, { file = "**.h" }]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "testcontainers>=3.7.1",
]
